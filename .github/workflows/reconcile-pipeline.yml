# Scheduled reconciler — the RECOVERY path of the relink identity contract.
#
# The fast path is inline: the SeforimLibrary build cancels its own dispatcher/child by
# exact request-id title on any exit, and the kaggle dispatcher's trap cancels the child
# it queued. This workflow closes what a point-in-time sweep cannot: a child that became
# visible only after the parent's cleanup ran, a dispatcher/runner that crashed without
# executing its trap, a parent killed so hard its cleanup step never ran, and a rerun
# superseding an attempt whose runs are still live. Logic lives in
# scripts/reconcile_pipeline.sh (env-injectable repos → testable with a mocked gh).
#
# Every action is idempotent and keyed on the per-attempt request id, so a tick can
# never touch a live attempt's runs or anything manual/standalone.
name: reconcile-pipeline
run-name: reconcile-pipeline

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions: {}

# Latest-only intent: ticks are identical; one pending is plenty. Never cancel a
# running tick mid-cancel — its actions are idempotent but a red half-tick is noise.
concurrency:
  group: reconcile-pipeline
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
    steps:
      # permissions:{} strips GITHUB_TOKEN; this private repo checkout and the
      # cross-repo run queries both use PIPELINE_TOKEN.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PIPELINE_TOKEN }}
          persist-credentials: false

      - name: Reap orphaned relink runs
        run: |
          set -euo pipefail
          [ -n "$GH_TOKEN" ] || { echo "::error::PIPELINE_TOKEN secret is empty or missing on this repo"; exit 1; }
          bash scripts/reconcile_pipeline.sh
