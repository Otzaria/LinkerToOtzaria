name: Recovery guard · Provision exact bounded Kaggle rerun (not a build stage)
run-name: kaggle-rerun-provisioner run=${{ inputs.run_id }}

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Exact queued relink run that needs a fresh JIT runner'
        required: true
        type: string

permissions: {}

concurrency:
  group: kaggle-rerun-provisioner
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      RUN_ID: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PIPELINE_TOKEN }}
          persist-credentials: false
      - run: pip install --quiet kaggle
      - name: Attach one fresh JIT runner to an exact queued rerun
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::run_id must be a positive integer"
            exit 1
          }
          bash scripts/provision_kaggle_rerun.sh --run-id "$RUN_ID"
