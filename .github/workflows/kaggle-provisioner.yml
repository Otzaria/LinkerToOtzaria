name: Recovery guard · Provision exact Kaggle intent (not a build stage)
run-name: kaggle-provisioner intent-run=${{ inputs.intent_run_id }}

on:
  workflow_dispatch:
    inputs:
      intent_run_id:
        description: 'Exact durable kaggle-relink intake run to provision'
        required: true
        type: string

permissions: {}

concurrency:
  group: kaggle-provisioner
  cancel-in-progress: false
  # Exact event-driven wake-ups share one singleton provisioner.

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Share the actual relink mutex from admission through child dispatch and
    # kernel push.  The child queues behind this short job and starts only after
    # the JIT session is ready; a server relink cannot enter the old check/use gap.
    concurrency:
      group: linker-relink
      cancel-in-progress: false
      # This group is shared with the hours-long relink child. Without an
      # unbounded pending queue, a later exact provisioner wake can replace the
      # pending slot that currently represents the active JIT handoff and GitHub
      # cancels the running relink (observed on run 29823214655).
      queue: max
    env:
      GH_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      INTENT_RUN_ID: ${{ inputs.intent_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PIPELINE_TOKEN }}
          persist-credentials: false
      - run: pip install --quiet kaggle
      - name: Provision the exact durable intent
        run: |
          set -euo pipefail
          [[ "$INTENT_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::intent_run_id must be a positive integer"
            exit 1
          }
          bash scripts/provision_kaggle_intent.sh
