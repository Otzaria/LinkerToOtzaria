# Launch a relink on a fresh Kaggle GPU session — the cloud arm of the linker.
#
# Wraps scripts/dispatch_kaggle_relink.sh (the exact flow the operator runs locally):
# register a one-job JIT runner, queue relink.yml with target=kaggle, push the private
# kernel (GPU + internet) that boots into the runner and picks the job up. The session
# dies with the job; nothing persists on Kaggle.
#
# Auth: PIPELINE_TOKEN (repo-admin — JIT registration + workflow dispatch) and
# KAGGLE_API_TOKEN (a Kaggle API token, KGAT_…; the OAuth credentials file breaks on
# expiry and on dataset APIs, the token does not).
name: kaggle-relink

on:
  workflow_dispatch:
    inputs:
      library_run_id:
        description: >
          SeforimLibrary run id for serial mode — forwarded to relink.yml so the
          session takes lines_snapshot.db.zst from (and hands artifacts back to)
          that exact waiting build. Empty = standalone relink.
        required: false
        default: ''
      sefaria_tag:
        description: Pinned SefariaExport tag — forwarded to relink.yml (serial mode).
        required: false
        default: ''
      snapshot_sha256:
        description: SHA-256 of lines_snapshot.db.zst — forwarded to relink.yml to verify the handoff.
        required: false
        default: ''
      dry_run:
        description: Skip publish + baseline commit on the relink (canary/testing).
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
    steps:
      # permissions:{} strips GITHUB_TOKEN, so checkout of this private repo must use
      # PIPELINE_TOKEN (Contents read) — the same PAT the dispatch step already needs.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PIPELINE_TOKEN }}
          persist-credentials: false

      - name: Kaggle CLI
        run: pip install --quiet kaggle

      - name: Register JIT runner, queue relink, push kernel
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: >
          bash scripts/dispatch_kaggle_relink.sh
          ${{ inputs.dry_run && '--dry-run' || '' }}
          ${{ inputs.library_run_id != '' && format('--library-run-id {0}', inputs.library_run_id) || '' }}
          ${{ inputs.sefaria_tag != '' && format('--sefaria-tag {0}', inputs.sefaria_tag) || '' }}
          ${{ inputs.snapshot_sha256 != '' && format('--snapshot-sha256 {0}', inputs.snapshot_sha256) || '' }}
