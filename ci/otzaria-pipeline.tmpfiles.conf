# Install as /etc/tmpfiles.d/otzaria-pipeline.conf on every shared heavy host,
# then run: sudo systemd-tmpfiles --create /etc/tmpfiles.d/otzaria-pipeline.conf
d /run/lock/otzaria 1777 root root -
f /run/lock/otzaria/host-heavy.lock 0666 root root -
# Linker creates linker-ner.scope.json here as mode 0644.  The sticky directory
# lets the Linker owner replace it while other runners may inspect it; a
# SeforimLibrary reaper removes it only through sudo after strict /proc checks.
